query CartInput(
  $customerTags: [String!]! = []
  $collectionIds: [ID!]! = []
) {
  cart {
    cost {
      subtotalAmount {
        amount
      }
    }
    buyerIdentity {
      customer {
        hasAnyTag(tags: $customerTags)
      }
    }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            inAnyCollection(ids: $collectionIds)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:tiered-pricing", key: "function-configuration") {
      jsonValue
    }
  }
}
