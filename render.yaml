# Render Blueprint for Tiered Pricing Shopify App
# Deploy with: Connect GitHub repo to Render and it will auto-detect this file
# Or use: render-cli deploy

services:
  # Main web service
  - type: web
    name: tiered-pricing
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: tiered-pricing-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: SHOPIFY_API_SECRET
        sync: false  # Set manually in Render dashboard
      - key: SHOPIFY_APP_URL
        value: https://tiered-pricing.onrender.com
      - key: SCOPES
        value: read_products,write_products,read_price_rules,write_price_rules,read_discounts,write_discounts,read_customers,read_orders

databases:
  # PostgreSQL database
  - name: tiered-pricing-db
    databaseName: tiered_pricing
    plan: free  # WARNING: Expires after 30 days
    region: oregon
