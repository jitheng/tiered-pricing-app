# Squid config for the Shopify Admin API egress proxy.
#
# Behaviour: require basic auth, allow HTTPS CONNECT tunnels only, and (by
# default) restrict destinations to Shopify so a leaked credential can't turn
# this into an open relay. The app only makes server-side fetch calls to
# *.myshopify.com, so this restriction is safe. To allow any destination,
# comment out `shopify_dst` below and use `http_access allow authenticated`.

# Squid starts as root (container PID 1) then drops privileges to this user.
# Required because our custom squid.conf replaces Debian's default (which sets
# it); without it squid FATALs: "Don't run Squid as root". The `proxy` user can
# read the 0644 htpasswd and write /var/log/squid.
cache_effective_user proxy

# ── Auth ─────────────────────────────────────────────────────────────────────
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm egress-proxy
auth_param basic credentialsttl 2 hours
acl authenticated proxy_auth REQUIRED

# ── Destination / method ACLs ────────────────────────────────────────────────
acl SSL_ports port 443
acl CONNECT method CONNECT
# Shopify-only destination allowlist (Admin API + token exchange live here).
acl shopify_dst dstdomain .myshopify.com .shopify.com

# ── Access rules ─────────────────────────────────────────────────────────────
# Only CONNECT to 443 (HTTPS). Block everything else early.
http_access deny CONNECT !SSL_ports
# Require a valid credential AND a Shopify destination.
http_access allow authenticated shopify_dst
http_access deny all

# ── Listener ─────────────────────────────────────────────────────────────────
http_port 3128
# Run fully in the foreground (container PID 1) and don't write a PID file, so a
# machine restart never aborts with "Squid is already running".
pid_filename none

# ── Privacy / hygiene ────────────────────────────────────────────────────────
# Don't advertise squid or leak the client's IP to upstream.
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
httpd_suppress_version_string on

# This is a pass-through proxy, not a cache.
cache deny all

# Squid can't open() /dev/stdout in this container (a known squid-in-Docker
# quirk → "FATAL: Cannot open '/dev/stdout'"). Instead, `-d1` in the entrypoint
# echoes startup banners and errors to the already-open stderr fd that Fly
# captures in `fly logs`. Send cache.log to /dev/null and access.log to a file
# (inspect with `fly ssh console` → tail /var/log/squid/access.log if needed).
cache_log /dev/null
access_log stdio:/var/log/squid/access.log
