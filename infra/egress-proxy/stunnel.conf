# stunnel: terminate TLS for the forward proxy and hand the (now plaintext)
# proxy protocol to squid on localhost. This encrypts the Vercel→proxy hop,
# including the Proxy-Authorization basic-auth header.
#
# cert/key are written from Fly secrets by docker-entrypoint.sh (never baked in).
foreground = yes
; Empty pid disables the pidfile (none needed in a foreground container).
pid =
; Log to stderr (Fly captures it); raise to 7 for debugging.
debug = 4
output = /dev/stderr

[squid-proxy-tls]
accept = 0.0.0.0:3128
connect = 127.0.0.1:3127
cert = /etc/stunnel/proxy-cert.pem
key = /etc/stunnel/proxy-key.pem
