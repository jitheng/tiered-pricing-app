# Shopify Admin API egress proxy — squid config for a plain VM (Oracle Cloud
# Always Free, Ubuntu 22.04). Unlike a VPS, a normal cloud VM uses ONE public
# IP for both inbound and outbound, so the IP you allowlist in Shopify is the
# same IP the box egresses from (no Fly-style ingress/egress split).
#
# Installed to /etc/squid/squid.conf by setup.sh (which backs up the original).

# squid is started by systemd as root, then drops to this user.
cache_effective_user proxy

# ── Auth ─────────────────────────────────────────────────────────────────────
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic realm egress-proxy
auth_param basic credentialsttl 2 hours
acl authenticated proxy_auth REQUIRED

# ── Destination / method ACLs ────────────────────────────────────────────────
acl SSL_ports port 443
acl CONNECT method CONNECT
# Shopify-only destination allowlist (Admin API + token exchange live here) so a
# leaked credential can't turn this into an open relay.
acl shopify_dst dstdomain .myshopify.com .shopify.com

# ── Access rules ─────────────────────────────────────────────────────────────
http_access deny CONNECT !SSL_ports
http_access allow authenticated shopify_dst
http_access deny all

# ── Listener ─────────────────────────────────────────────────────────────────
http_port 3128

# ── Privacy / hygiene ────────────────────────────────────────────────────────
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
httpd_suppress_version_string on

# Pass-through proxy, not a cache.
cache deny all

# Standard file logging (inspect with: sudo tail -f /var/log/squid/access.log).
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
