# Fly.io config for the Shopify Admin API egress proxy.
# Raw TCP service on 3128 (not HTTP), so it needs a DEDICATED IPv4
# (`fly ips allocate-v4`, ~$2/mo) — that IP is what you allowlist in Shopify.
# Rename `app` to something unique in your Fly org before first deploy.
app = "tiered-pricing-egress"
primary_region = "iad"  # Ashburn — same metro as Vercel's iad1

[build]

[[services]]
  protocol = "tcp"
  internal_port = 3128
  # Keep the proxy always-on: it's the single path for all Admin API calls.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3128

  [services.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
