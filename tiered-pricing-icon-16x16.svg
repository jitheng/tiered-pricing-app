<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Navy background -->
  <rect width="16" height="16" fill="#12165A" rx="2"/>
  <!-- Three ascending bars: teal | violet | sky-blue -->
  <!-- Bar 1 (short, teal) -->
  <rect x="2" y="9" width="3" height="5" fill="#34D3A0" rx="0.5"/>
  <!-- Bar 2 (medium, violet) -->
  <rect x="6" y="6" width="3" height="8" fill="#8B5AF6" rx="0.5"/>
  <!-- Bar 3 (tall, sky-blue) -->
  <rect x="10" y="3" width="3" height="11" fill="#38BDF8" rx="0.5"/>
</svg>
